# PharmaQuick - Test con JWT Authentication
# Este test prueba autenticación JWT y endpoints protegidos
# Flujo: Login -> Captura token -> Endpoints protegidos

config:
  target: "http://localhost:8080"
  phases:
    - name: "Warm-up"
      duration: 20
      arrivalRate: 2
    - name: "Carga con auth"
      duration: 60
      arrivalRate: 2
      rampTo: 10
  variables:
    email: "admin@pharmaquick.com"
    password: "password"
  ensure:
    thresholds:
      - http.response_time.p95: 500
      - http.response_time.p99: 1000
    conditions:
      - expression: "http.codes.200 > 0"
        strict: true

scenarios:
  - name: "Flujo usuario autenticado"
    weight: 80
    flow:
      # PASO 1: Login y captura de token JWT
      - post:
          url: "/api/auth/login"
          json:
            email: "{{ email }}"
            password: "{{ password }}"
          expect:
            - statusCode: 200
          capture:
            - json: "$.data.token"
              as: "jwtToken"

      - think: 1

      # PASO 2: Obtener perfil del usuario
      - get:
          url: "/api/perfil"
          headers:
            Authorization: "Bearer {{ jwtToken }}"
          expect:
            - statusCode: 200

      - think: 2

      # PASO 3: Listar productos
      - get:
          url: "/api/productos"
          headers:
            Authorization: "Bearer {{ jwtToken }}"
          expect:
            - statusCode: 200

      - think: 2

      # PASO 4: Obtener catálogo público (debe funcionar con auth también)
      - get:
          url: "/api/public/catalogo"
          headers:
            Authorization: "Bearer {{ jwtToken }}"
          expect:
            - statusCode: 200

      - think: 1

      # PASO 5: Obtener resumen de inventario
      - get:
          url: "/api/inventario/resumen"
          headers:
            Authorization: "Bearer {{ jwtToken }}"
          expect:
            - statusCode: 200

      - think: 2

      # PASO 6: Obtener alertas de inventario
      - get:
          url: "/api/inventario/alertas"
          headers:
            Authorization: "Bearer {{ jwtToken }}"
          expect:
            - statusCode: 200

  - name: "Visitante público (sin auth)"
    weight: 20
    flow:
      - get:
          url: "/"
          expect:
            - statusCode: 200
      - think: 2
      - get:
          url: "/api/public/catalogo"
          expect:
            - statusCode: 200
      - think: 1
      - get:
          url: "/health"
          expect:
            - statusCode: 200