# =========================================================
# PharmaQuick - Configuracion Nginx para SPA
# Dominio: localhost:8080
# SPA: rutas清洁 con try_files /index.html
# =========================================================

upstream php_backend {
    server php:9000;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    # SPA shell primero: evita que / ejecute index.php vía directory index
    index index.html index.php;
    client_max_body_size 20M;

    # ------------------------------------------------------------
    # Logs
    # ------------------------------------------------------------
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ------------------------------------------------------------
    # Bloquear acceso a /pages/ (rutas antiguas)
    # Redirigir al root del SPA
    # ------------------------------------------------------------
    location /pages/ {
        return 301 /;
    }

    # Raíz explícita → shell SPA (sin pasar por índice de directorio / PHP)
    location = / {
        try_files /index.html =404;
    }

    # ------------------------------------------------------------
    # SPA Routing - try_files para rutas limpias
    # Si el archivo no existe fisicamente, sirven index.html
    # Esto permite /dashboard, /productos, /login, etc.
    # ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------
    # Login - ruta limpia
    # ------------------------------------------------------------
    location = /login {
        try_files $uri /index.html;
    }

    # ------------------------------------------------------------
    # Dashboard - ruta protegida
    # ------------------------------------------------------------
    location = /dashboard {
        try_files $uri /index.html;
    }

    # ------------------------------------------------------------
    # Rutas de cliente (/cliente/...)
    # ------------------------------------------------------------
    location /cliente/ {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------
    # Productos - ruta protegida
    # ------------------------------------------------------------
    location = /productos {
        try_files $uri /index.html;
    }

    # ------------------------------------------------------------
    # Archivos estaticos JS, CSS con cache
    # ------------------------------------------------------------
    # ^~ evita que la regex de caché larga (~* \.js$) capture estos JS/CSS del SPA
    location ^~ /js/ {
        root /var/www/html/public;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location ^~ /css/ {
        root /var/www/html/public;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # ------------------------------------------------------------
    # Frontend modules (para SPA)
    # ------------------------------------------------------------
    location ^~ /frontend/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # ------------------------------------------------------------
    # Uploads (imágenes de productos)
    # ------------------------------------------------------------
    location /uploads/ {
        alias /var/www/html/public/uploads/;
        try_files $uri = 404;
        add_header Cache-Control "public, max-age=86400";
    }

    # ------------------------------------------------------------
    # Imagenes públicas (logo, etc.)
    # ------------------------------------------------------------
    location /image/ {
        alias /var/www/html/public/image/;
        try_files $uri = 404;
        add_header Cache-Control "public, max-age=86400";
    }

    # ------------------------------------------------------------
    # API Routing - todas las peticiones van a index.php
    # ------------------------------------------------------------
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ------------------------------------------------------------
    # Routing PHP - Todas las peticiones API van a index.php
    # ------------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;

        #Timeouts y buffers
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;

        include fastcgi_params;
    }

    # ------------------------------------------------------------
    # Denegar acceso a archivos sensibles
    # ------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/src/ {
        deny all;
        return 404;
    }

    location ~ ^/docs/ {
        deny all;
        return 404;
    }

    # ------------------------------------------------------------
    # Archivos estaticos - caching extensivo (no aplica a /frontend/ ni /js/: usan ^~ arriba)
    # ------------------------------------------------------------
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        access_log off;
    }

    # ------------------------------------------------------------
    # Configuracion de seguridad
    # ------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}