# =========================================================
# PharmaQuick - Configuracion Nginx
# Dominio: localhost:8080
# Routing: todas las solicitudes -> /public/index.php
# =========================================================

upstream php_backend {
    server pharma_php:9000;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    # ------------------------------------------------------------
    # Logs
    # ------------------------------------------------------------
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ------------------------------------------------------------
    # Document Root - todas las peticiones van a index.php
    # ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ------------------------------------------------------------
    # Routing PHP - Todas las peticiones API van a index.php
    # ------------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;

        #Timeouts y buffers
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;

        include fastcgi_params;
    }

    # ------------------------------------------------------------
    # Denegar acceso a archivos sensibles
    # ------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/src/ {
        deny all;
        return 404;
    }

    location ~ ^/docs/ {
        deny all;
        return 404;
    }

    # ------------------------------------------------------------
    # Archivos estaticos - caching extensivo
    # ------------------------------------------------------------
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------
    # Configuracion de seguridad
    # ------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}