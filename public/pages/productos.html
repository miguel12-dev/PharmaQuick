<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>PharmaQuick - Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
    <link href="../../frontend/styles/app.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container-fluid">
            <button class="navbar-toggler me-2" type="button" id="sidebarToggle">
                <i class="bi bi-list"></i>
            </button>
            <a class="navbar-brand" href="#">
                <i class="bi bi-capsule me-2"></i>PharmaQuick
            </a>
            <div class="d-flex align-items-center ms-auto">
                <div class="dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>
                        <span id="userName">Usuario</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Perfil</a></li>
                        <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Configuración</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <nav class="sidebar" id="sidebar">
        <div class="py-3">
            <div class="px-3 mb-3">
                <small class="text-muted text-uppercase fw-bold">Menú Principal</small>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-speedometer2"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/pages/productos.html">
                        <i class="bi bi-box-seam"></i>Productos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-receipt"></i>Ventas
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-people"></i>Clientes
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-graph-up"></i>Reportes
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="main-content" id="mainContent">
        <div class="container-fluid">
            <!-- Contenedor principal de productos -->
            <div id="productsContainer" class="products-view"></div>
            
            <!-- Contenedor de precios (oculto, se usa en modales) -->
            <div id="pricesContainer" class="d-none"></div>
        </div>
    </main>

    <script src="../../frontend/core/config/env.js"></script>
    <script src="../../frontend/core/auth/AuthService.js"></script>
    <script src="../../frontend/core/api/HttpClient.js"></script>
    <script src="../../frontend/components/Modal.js"></script>
    <script src="../../frontend/components/Toast.js"></script>
    <script src="../../frontend/modules/products/ProductService.js"></script>
    <script src="../../frontend/modules/products/ProductController.js"></script>
    <script src="../../frontend/modules/products/ProductView.js"></script>
    <script src="../../frontend/modules/prices/PriceService.js"></script>
    <script src="../../frontend/modules/prices/PriceController.js"></script>
    <script src="../../frontend/modules/prices/PriceView.js"></script>
    <script src="../../frontend/pages/ProductsPage.js"></script>
    <script src="../js/layout.js"></script>
    
    <script>
        // Inicializar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar autenticación
            if (!AuthService.isAuthenticated()) {
                window.location.href = '/login';
                return;
            }
            
            // Inicializar ProductView en el contenedor
            const container = document.getElementById('productsContainer');
            if (container) {
                window.productView = new ProductView('#productsContainer');
            }
            
            // Inicializar PriceView
            new PriceView('#pricesContainer');
        });
    </script>
</body>
</html>
