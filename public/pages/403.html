<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>403 - Acceso Denegado | PharmaQuick</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        }
        .error-content {
            text-align: center;
            padding: 2rem;
        }
        .error-icon {
            font-size: 6rem;
            color: #dc3545;
            opacity: 0.8;
            margin-bottom: 1rem;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: #dc3545;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .error-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--pq-text);
            margin-bottom: 0.5rem;
        }
        .error-message {
            color: var(--pq-text-muted);
            margin-bottom: 2rem;
            max-width: 400px;
        }
    </style>
</head>
<body class="error-page">
    <div class="error-content fade-in">
        <div class="error-icon">
            <i class="bi bi-shield-lock"></i>
        </div>
        <div class="error-code">403</div>
        <h1 class="error-title">Acceso Denegado</h1>
        <p class="error-message">
            No tienes permisos para acceder a esta página. Contacta al administrador si crees que esto es un error.
        </p>
        <div class="d-flex gap-3 justify-content-center">
            <a href="/pages/dashboard.html" class="btn btn-primary">
                <i class="bi bi-house me-2"></i>Volver al Dashboard
            </a>
        </div>
    </div>
</body>
</html>
