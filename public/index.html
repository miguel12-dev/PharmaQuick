<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>PharmaQuick</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>">
    <!-- Font Awesome 6 (Local) -->
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Contenedor principal SPA -->
    <div id="app"></div>

    <!-- Template: Login Page -->
    <template id="template-login">
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                    <div class="card shadow-lg border-0">
                        <div class="card-body p-4">
                            <div class="text-center mb-4">
                                <i class="bi bi-capsule text-primary fs-1"></i>
                                <h3 class="mt-2 fw-bold text-dark">PharmaQuick</h3>
                                <p class="text-muted small">Gestión de Farmacias</p>
                            </div>

                            <form id="loginForm">
                                <div class="mb-3">
                                    <label for="email" class="form-label fw-semibold">
                                        <i class="bi bi-envelope me-2"></i>Correo Electrónico
                                    </label>
                                    <input type="email" class="form-control" id="email" required
                                           placeholder="admin@pharmaquick.com" autocomplete="email">
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label fw-semibold">
                                        <i class="bi bi-key me-2"></i>Contraseña
                                    </label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="password" required
                                               placeholder="**********" autocomplete="current-password">
                                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                            <i class="bi bi-eye" id="toggleIcon"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">Recordarme</label>
                                </div>

                                <div id="loginError" class="alert alert-danger d-none" role="alert">
                                    <i class="bi bi-exclamation-triangle me-2"></i>
                                    <span id="errorMessage"></span>
                                </div>

                                <div id="loginSuccess" class="alert alert-success d-none" role="alert">
                                    <i class="bi bi-check-circle me-2"></i>
                                    <span id="successMessage"></span>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="loginBtn">
                                    <span id="loginBtnText">Iniciar Sesión</span>
                                    <span id="loginBtnSpinner" class="spinner-border spinner-border-sm d-none" role="status">
                                        <span class="visually-hidden">Cargando...</span>
                                    </span>
                                </button>
                            </form>
                        </div>
                    </div>

                    <div class="text-center mt-3">
                        <small class="text-muted">&copy; 2024 PharmaQuick v1.0</small>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Template: Layout (Navbar + Sidebar) -->
    <template id="template-layout">
       <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-prescription-bottle-medical fa-lg me-2"></i>
            <span class="fw-bold fs-5">PharmaQuick</span>
        </div>
        <nav class="nav flex-column py-3">
            <a class="nav-link active" href="#" data-page="dashboard">
                <i class="fas fa-chart-line"></i>
                <span class="nav-text">Dashboard</span>
            </a>
            <a class="nav-link" href="#" data-page="ventas">
                <i class="fas fa-cart-shopping"></i>
                <span class="nav-text">Ventas</span>
            </a>
            <a class="nav-link" href="#" data-page="productos">
                <i class="fas fa-pills"></i>
                <span class="nav-text">Productos</span>
            </a>
            <a class="nav-link" href="#" data-page="inventario">
                <i class="fas fa-boxes-stacked"></i>
                <span class="nav-text">Inventario</span>
            </a>
            <a class="nav-link" href="#" data-page="clientes">
                <i class="fas fa-users"></i>
                <span class="nav-text">Clientes</span>
            </a>
            <a class="nav-link" href="#" data-page="proveedores">
                <i class="fas fa-truck-field"></i>
                <span class="nav-text">Proveedores</span>
            </a>
            <hr class="mx-3 my-2 text-white-50">
            <a class="nav-link" href="#" data-page="reportes">
                <i class="fas fa-file-invoice-dollar"></i>
                <span class="nav-text">Reportes</span>
            </a>
            <a class="nav-link" href="#" data-page="configuracion">
                <i class="fas fa-gear"></i>
                <span class="nav-text">Configuración</span>
            </a>
        </nav>
        
        <div class="mt-auto p-3 border-top border-white-50 border-opacity-10">
            <a class="nav-link text-danger" href="login.html">
                <i class="fas fa-right-from-bracket"></i>
                <span class="nav-text">Cerrar Sesión</span>
            </a>
        </div>
    </aside>

    <div class="main-content">
        <nav class="navbar navbar-expand-lg fixed-top shadow-sm px-4">
            <div class="container-fluid p-0">
                <button class="btn btn-link link-dark p-0 me-3" id="sidebarToggle">
                    <i class="fas fa-bars-staggered fa-lg"></i>
                </button>
                
                <h4 class="m-0 fw-semibold text-dark" id="pageTitle">Dashboard</h4>
                
                <div class="ms-auto d-flex align-items-center">
                    <div class="dropdown">
                        <button class="btn btn-link position-relative me-3 text-dark p-0" data-bs-toggle="dropdown">
                            <i class="fas fa-bell"></i>
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem;">
                                3
                            </span>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <div class="container-fluid">
                <div class="page-content"></div>
            </div>
        </main>
    </template>

    <!-- Template: Dashboard Page -->
    <template id="template-dashboard">
        <div class="welcome-card card mb-4">
            <div class="card-body py-4">
                <h2 class="mb-1">Bienvenido a PharmaQuick</h2>
                <p class="text-muted mb-0">Gestión integral para tu farmacia</p>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-lg-3">
                <div class="card stats-card h-100">
                    <div class="card-body">
                        <h6 class="text-muted">Ventas Hoy</h6>
                        <h4 class="mb-0" id="ventasHoy">$0</h4>
                    </div>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card stats-card h-100">
                    <div class="card-body">
                        <h6 class="text-muted">Transacciones</h6>
                        <h4 class="mb-0" id="transacciones">0</h4>
                    </div>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card stats-card h-100">
                    <div class="card-body">
                        <h6 class="text-muted">Productos</h6>
                        <h4 class="mb-0" id="productos">0</h4>
                    </div>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card stats-card h-100">
                    <div class="card-body">
                        <h6 class="text-muted">Alertas</h6>
                        <h4 class="mb-0" id="alertas">0</h4>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Access -->
        <div class="card mb-4">
            <div class="card-header"><h5 class="mb-0">Acceso Rápido</h5></div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-6 col-md-3">
                        <a href="/productos" class="quick-access-card">
                            <i class="bi bi-box-seam fs-3"></i>
                            <h6 class="mt-2 mb-0">Productos</h6>
                        </a>
                    </div>
                    <div class="col-6 col-md-3">
                        <a href="#" class="quick-access-card">
                            <i class="bi bi-cart-plus fs-3"></i>
                            <h6 class="mt-2 mb-0">Nueva Venta</h6>
                        </a>
                    </div>
                    <div class="col-6 col-md-3">
                        <a href="#" class="quick-access-card">
                            <i class="bi bi-box-seam-fill fs-3"></i>
                            <h6 class="mt-2 mb-0">Inventario</h6>
                        </a>
                    </div>
                    <div class="col-6 col-md-3">
                        <a href="#" class="quick-access-card">
                            <i class="bi bi-people fs-3"></i>
                            <h6 class="mt-2 mb-0">Clientes</h6>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Activity -->
        <div class="row g-3">
            <div class="col-12 col-lg-8">
                <div class="card">
                    <div class="card-header"><h5 class="mb-0">Últimas Ventas</h5></div>
                    <div class="card-body">
                        <table class="table">
                            <thead><tr><th>ID</th><th>Fecha</th><th>Total</th><th>Estado</th></tr></thead>
                            <tbody id="ventasTable"><tr><td colspan="4" class="text-muted">Cargando...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-12 col-lg-4">
                <div class="card">
                    <div class="card-header"><h5 class="mb-0">Actividad</h5></div>
                    <div class="card-body">
                        <div class="activity-item"><div class="content"><div class="title">Venta registrada</div><div class="time">Hace 5 min</div></div></div>
                        <div class="activity-item"><div class="content"><div class="title">Inventario bajo</div><div class="time">Hace 15 min</div></div></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-footer text-center mt-4">
            <small class="text-muted">&copy; 2024 PharmaQuick</small>
        </div>
    </template>

    <!-- Template: Products Page -->
    <template id="template-productos">
        <!-- Products container -->
        <div id="productsContainer"></div>
        <div id="pricesContainer" class="d-none"></div>
    </template>

    <!-- Template: 404 Page -->
    <template id="template-404">
        <div class="container-fluid p-4">
            <div class="text-center py-5">
                <i class="bi bi-exclamation-circle text-warning" style="font-size: 4rem;"></i>
                <h2 class="mt-3">Página no encontrada</h2>
                <p class="text-muted">La página que buscas no existe.</p>
                <a href="/dashboard" class="btn btn-primary mt-3">Volver al Dashboard</a>
            </div>
        </div>
    </template>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Core -->
    <script src="frontend/core/config/env.js"></script>
    <script src="frontend/core/router/Router.js"></script>
    <script src="frontend/core/auth/AuthService.js"></script>
    <script src="frontend/core/api/HttpClient.js"></script>
    <script src="frontend/core/api/HttpErrorHandler.js"></script>
    
    <!-- Components -->
    <script src="frontend/components/Toast.js"></script>
    <script src="frontend/components/Modal.js"></script>
    <script src="frontend/components/Table.js"></script>
    <script src="frontend/components/Input.js"></script>
    <script src="frontend/components/Button.js"></script>
    
    <!-- Modules -->
    <script src="frontend/modules/products/ProductService.js"></script>
    <script src="frontend/modules/products/ProductController.js"></script>
    <script src="frontend/modules/products/ProductViewRenderer.js"></script>
    <script src="frontend/modules/products/ProductFormRenderer.js"></script>
    <script src="frontend/modules/products/ProductView.js"></script>
    <script src="frontend/modules/prices/PriceService.js"></script>
    <script src="frontend/modules/prices/PriceController.js"></script>
    <script src="frontend/modules/prices/PriceView.js"></script>
    
    <!-- Pages -->
    <script src="frontend/pages/LoginPage.js"></script>
    <script src="frontend/pages/DashboardPage.js"></script>
    <script src="frontend/pages/ProductsPage.js"></script>
    <script src="frontend/pages/NotFoundPage.js"></script>
    
    <!-- App -->
    <script src="js/app.js"></script>
</body>
</html>
