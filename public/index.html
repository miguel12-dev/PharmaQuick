<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <base href="/">
    <title>PharmaQuick</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>">
    <!-- Font Awesome 6 (Local) -->
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/styles.css?v=home-modern" rel="stylesheet">
    <link href="css/site-header.css?v=home-modern" rel="stylesheet">

    <link href="frontend/styles/client-catalog.css" rel="stylesheet">
    <link href="frontend/styles/client-shopping.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Contenedor principal SPA -->
    <div id="app"></div>

    <!-- Template: Login Page (solo tarjeta; cabecera en frontend/layout/SiteHeader.js) -->
    <template id="template-login">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                    <div class="card login-card shadow-lg border-0">
                        <div class="card-body">
                            <div class="text-center mb-2">
                                <img src="image/logo_pharmaQuick.png" alt="PharmaQuick" style="height: 45px; max-width: 100%;" class="img-fluid">
                            </div>
                            <p class="text-center login-subtitle mb-4 mb-lg-4">
                                Ingresa con tu cuenta de farmacia para continuar.
                            </p>

                            <form id="loginForm">
                                <div class="mb-3">
                                    <label for="email" class="form-label fw-semibold">
                                        <i class="bi bi-envelope me-2"></i>Correo Electrónico
                                    </label>
                                    <input type="email" class="form-control" id="email" required
                                           placeholder="admin@pharmaquick.com" autocomplete="email">
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label fw-semibold">
                                        <i class="bi bi-key me-2"></i>Contraseña
                                    </label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="password" required
                                               placeholder="**********" autocomplete="current-password">
                                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                            <i class="bi bi-eye" id="toggleIcon"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">Recordarme</label>
                                </div>

                                <div class="mb-3 text-end">
                                    <a href="/recover-password" class="text-muted small text-decoration-none">
                                        <i class="bi bi-question-circle me-1"></i>¿Olvidaste tu contraseña?
                                    </a>
                                </div>

                                <div id="loginError" class="alert alert-danger d-none" role="alert">
                                    <i class="bi bi-exclamation-triangle me-2"></i>
                                    <span id="errorMessage"></span>
                                </div>

                                <div id="loginSuccess" class="alert alert-success d-none" role="alert">
                                    <i class="bi bi-check-circle me-2"></i>
                                    <span id="successMessage"></span>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="loginBtn">
                                    <span id="loginBtnText">Iniciar Sesión</span>
                                    <span id="loginBtnSpinner" class="spinner-border spinner-border-sm d-none" role="status">
                                        <span class="visually-hidden">Cargando...</span>
                                    </span>
                                </button>
                            </form>

                            <div class="text-center mt-4 pt-3 border-top">
                                <p class="text-muted small mb-0">¿Aún no tienes una cuenta?</p>
                                <a href="/register" class="btn btn-link text-primary fw-bold text-decoration-none p-0" onclick="event.preventDefault(); Router.navigate('/register')">Regístrate aquí</a>
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-3">
                        <small class="text-muted">&copy; 2026 PharmaQuick v1.0</small>
                    </div>
                </div>
            </div>
    </template>

    <!-- Template: Recover Password Page -->
    <template id="template-recover-password">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                    <div class="card login-card shadow-lg border-0">
                        <div class="card-body">
                            <div class="text-center mb-2">
                                <img src="/image/logo_pharmaQuick.png" alt="PharmaQuick" style="height: 45px; max-width: 100%;" class="img-fluid">
                            </div>
                            <p class="text-center login-subtitle mb-4">
                                Ingresa tu correo para recuperar tu contraseña.
                            </p>

                            <form id="recoverForm">
                                <div class="mb-3">
                                    <label for="email" class="form-label fw-semibold">
                                        <i class="bi bi-envelope me-2"></i>Correo Electrónico
                                    </label>
                                    <input type="email" class="form-control" id="email" required
                                           placeholder="tu@email.com" autocomplete="email">
                                </div>

                                <div id="recoverError" class="alert alert-danger d-none" role="alert">
                                    <i class="bi bi-exclamation-triangle me-2"></i>
                                    <span id="recoverErrorMessage"></span>
                                </div>

                                <div id="recoverSuccess" class="alert alert-success d-none" role="alert">
                                    <i class="bi bi-check-circle me-2"></i>
                                    <span id="recoverSuccessMessage"></span>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="recoverBtn">
                                    <span id="recoverBtnText">Enviar Enlace de Recuperación</span>
                                    <span id="recoverBtnSpinner" class="spinner-border spinner-border-sm d-none" role="status">
                                        <span class="visually-hidden">Cargando...</span>
                                    </span>
                                </button>
                            </form>

                            <div class="text-center mt-4 pt-3 border-top">
                                <a href="#" class="btn btn-link text-primary fw-bold text-decoration-none p-0" onclick="event.preventDefault(); Router.navigate('/login')">
                                    <i class="bi bi-arrow-left me-1"></i>Volver a Iniciar Sesión
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-3">
                        <small class="text-muted">&copy; 2026 PharmaQuick v1.0</small>
                    </div>
                </div>
            </div>
    </template>

    <!-- Template: Register Page -->
    <template id="template-register">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                    <div class="card login-card shadow-lg border-0">
                        <div class="card-body">
                            <div class="text-center mb-2">
                                <img src="/image/logo_pharmaQuick.png" alt="PharmaQuick" style="height: 45px; max-width: 100%;" class="img-fluid">
                            </div>
                                Crea tu cuenta de farmacia para comenzar a ordenar.
                            </p>

                            <form id="registerForm">
                                <div class="mb-3">
                                    <label for="nombre" class="form-label fw-semibold">
                                        <i class="bi bi-person me-2"></i>Nombre Completo
                                    </label>
                                    <input type="text" class="form-control" id="nombre" required
                                           placeholder="Ej: Juan Pérez" autocomplete="name">
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label fw-semibold">
                                        <i class="bi bi-envelope me-2"></i>Correo Electrónico
                                    </label>
                                    <input type="email" class="form-control" id="email" required
                                           placeholder="nombre@ejemplo.com" autocomplete="email">
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label fw-semibold">
                                        <i class="bi bi-key me-2"></i>Contraseña
                                    </label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="password" required
                                               placeholder="Mínimo 6 caracteres" minlength="6" autocomplete="new-password">
                                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="confirm_password" class="form-label fw-semibold">
                                        <i class="bi bi-key-fill me-2"></i>Confirmar Contraseña
                                    </label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="confirm_password" required
                                               placeholder="Repite tu contraseña" autocomplete="new-password">
                                        <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
                                            <i class="bi bi-eye" id="toggleConfirmPasswordIcon"></i>
                                        </button>
                                    </div>
                                </div>

                                <div id="registerError" class="alert alert-danger d-none" role="alert">
                                    <i class="bi bi-exclamation-triangle me-2"></i>
                                    <span id="registerErrorMessage"></span>
                                </div>

                                <div id="registerSuccess" class="alert alert-success d-none" role="alert">
                                    <i class="bi bi-check-circle me-2"></i>
                                    <span id="registerSuccessMessage"></span>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="registerBtn">
                                    <span id="registerBtnText">Crear Cuenta</span>
                                    <span id="registerBtnSpinner" class="spinner-border spinner-border-sm d-none" role="status">
                                        <span class="visually-hidden">Cargando...</span>
                                    </span>
                                </button>
                            </form>

                            <div class="text-center mt-4 pt-2 border-top">
                                <p class="text-muted small mb-0">¿Ya tienes una cuenta?</p>
                                <a href="/login" class="btn btn-link text-primary fw-bold text-decoration-none p-0" onclick="event.preventDefault(); Router.navigate('/login')">Inicia Sesión</a>
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-3">
                        <small class="text-muted">&copy; 2026 PharmaQuick v1.0</small>
                    </div>
                </div>
            </div>
    </template>

    <!-- Template: Layout (Navbar + Sidebar) -->
    <template id="template-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="d-flex align-items-center w-100">
                    <img src="image/logo_pharmaQuick.png" alt="PharmaQuick" class="sidebar-logo">
                </div>
            </div>
            <div class="sidebar-collapse-control d-none d-md-flex">
                <button class="btn btn-link link-light p-0" id="sidebarCollapseBtn" type="button" aria-label="Colapsar sidebar">
                    <i class="fas fa-chevron-left sidebar-toggle-icon"></i>
                </button>
            </div>
            <nav class="nav flex-column py-3">
                <a class="nav-link active" href="/dashboard" data-page="dashboard">
                    <i class="fas fa-chart-pie"></i>
                    <span class="nav-text">Dashboard</span>
                </a>
                <a class="nav-link" href="/productos" data-page="productos">
                    <i class="fas fa-pills"></i>
                    <span class="nav-text">Productos</span>
                </a>
                <a class="nav-link" href="/inventario" data-page="inventario">
                    <i class="fas fa-boxes-stacked"></i>
                    <span class="nav-text">Inventario</span>
                </a>

                <!-- [DESHABILITADO] Reservas - Deshabilitado por no utilizarse
                <a class="nav-link" href="/reservas" data-page="reservas">
                    <i class="fas fa-calendar-alt"></i>
                    <span class="nav-text">Reservas</span>
                </a>
                -->
                <hr class="mx-3 my-2 text-white-50">

                <a class="nav-link" href="/perfil" data-page="perfil">
                    <i class="fas fa-user"></i>
                    <span class="nav-text">Perfil</span>
                </a>
            </nav>
            
            <div class="mt-auto p-3 border-top border-white-50 border-opacity-10">
                <a class="nav-link text-danger-light" href="#" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="nav-text sidebar-footer-text">Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <div class="main-content" id="mainContent">
            <nav class="navbar navbar-expand-lg fixed-top px-4">
                <div class="container-fluid p-0">
                    <img src="image/logo_pharmaQuick.png" alt="PharmaQuick" class="navbar-logo-collapsed me-3">
                    <button class="btn btn-link link-dark p-0 me-3 d-md-none" id="sidebarToggleMobile">
                        <i class="fas fa-bars fa-lg"></i>
                    </button>

                    <div class="ms-auto d-flex align-items-center">
                        <div class="dropdown">
                            <button class="btn btn-light rounded-circle p-0 me-3 position-relative" style="width: 40px; height: 40px;" data-bs-toggle="dropdown">
                                <i class="fas fa-bell text-secondary"></i>
                                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger shadow-sm" style="font-size: 0.6rem; border: 2px solid white;">
                                    3
                                </span>
                            </button>
                        </div>
                        <div class="dropdown">
                            <button class="btn d-flex align-items-center gap-2 p-1 pe-3 border rounded-pill bg-white shadow-sm" data-bs-toggle="dropdown">
                                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                                    <i class="fas fa-user-circle"></i>
                                </div>
                                <span class="fw-semibold small d-none d-sm-inline" id="userName">Admin</span>
                                <i class="fas fa-chevron-down x-small opacity-50"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-2">
                                <li><a class="dropdown-item py-2" href="/perfil"><i class="fas fa-user me-2 opacity-50"></i> Perfil</a></li>
                                <li><a class="dropdown-item py-2" href="#"><i class="fas fa-cog me-2 opacity-50"></i> Ajustes</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item py-2 text-danger" href="#" id="logoutBtnDropdown"><i class="fas fa-power-off me-2 opacity-50"></i> Salir</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- Main Content Area -->
            <div class="container-fluid py-4">
                <h4 class="m-0 mb-4 fw-bold text-dark" id="pageTitle">Dashboard</h4>
                <div class="page-content fade-in-up"></div>
            </div>
        </div>
    </template>

    <!-- Template: Dashboard Page -->
    <template id="template-dashboard">
        <div class="welcome-card card mb-4 border-0 shadow-sm">
            <div class="card-body p-4 d-flex align-items-center justify-content-between">
                <div>
                    <h2 class="mb-1 text-white">¡Hola de nuevo!</h2>
                    <p class="mb-0 text-white opacity-75">Bienvenido al panel de control de PharmaQuick.</p>
                </div>
                <div class="d-none d-md-block opacity-25">
                    <i class="fas fa-hand-holding-medical fa-4x text-white"></i>
                </div>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="row g-4 mb-4">
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card stats-card border-0 shadow-sm h-100" style="border-left: 4px solid var(--pq-primary) !important;">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="text-muted text-uppercase small fw-bold mb-0">Ventas Hoy</h6>
                            <div class="bg-primary-soft p-2 rounded">
                                <i class="fas fa-dollar-sign text-primary"></i>
                            </div>
                        </div>
                        <h3 class="mb-0 fw-bold" id="ventasHoy">$0.00</h3>
                        <p class="text-success small mb-0 mt-2">
                            <i class="fas fa-arrow-up me-1"></i> 12% vs ayer
                        </p>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card stats-card border-0 shadow-sm h-100" style="border-left: 4px solid var(--pq-info) !important;">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="text-muted text-uppercase small fw-bold mb-0">Pedidos</h6>
                            <div class="bg-info-soft p-2 rounded">
                                <i class="fas fa-shopping-basket text-info"></i>
                            </div>
                        </div>
                        <h3 class="mb-0 fw-bold" id="transacciones">0</h3>
                        <p class="text-muted small mb-0 mt-2">Nuevos pedidos registrados</p>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card stats-card border-0 shadow-sm h-100" style="border-left: 4px solid var(--pq-warning) !important;">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="text-muted text-uppercase small fw-bold mb-0">Total Productos</h6>
                            <div class="bg-warning-soft p-2 rounded">
                                <i class="fas fa-pills text-warning"></i>
                            </div>
                        </div>
                        <h3 class="mb-0 fw-bold" id="productos">0</h3>
                        <p class="text-warning small mb-0 mt-2">
                            <i class="fas fa-exclamation-triangle me-1"></i> 5 en bajo stock
                        </p>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card stats-card border-0 shadow-sm h-100" style="border-left: 4px solid var(--pq-danger) !important;">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="text-muted text-uppercase small fw-bold mb-0">Alertas Críticas</h6>
                            <div class="bg-danger-soft p-2 rounded">
                                <i class="fas fa-bell text-danger"></i>
                            </div>
                        </div>
                        <h3 class="mb-0 fw-bold" id="alertas">0</h3>
                        <p class="text-muted small mb-0 mt-2">Requieren tu atención</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Access -->
        <div class="card mb-4">
            <div class="card-header"><h5 class="mb-0">Acceso Rápido</h5></div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-6 col-md-3">
                        <a href="/productos" class="quick-access-card">
                            <i class="bi bi-box-seam fs-3"></i>
                            <h6 class="mt-2 mb-0">Productos</h6>
                        </a>
                    </div>
                    <div class="col-6 col-md-3">
                        <a href="#" class="quick-access-card">
                            <i class="bi bi-cart-plus fs-3"></i>
                            <h6 class="mt-2 mb-0">Nueva Venta</h6>
                        </a>
                    </div>
                    <div class="col-6 col-md-3">
                        <a href="#" class="quick-access-card">
                            <i class="bi bi-box-seam-fill fs-3"></i>
                            <h6 class="mt-2 mb-0">Inventario</h6>
                        </a>
                    </div>
                    <div class="col-6 col-md-3">
                        <a href="#" class="quick-access-card">
                            <i class="bi bi-people fs-3"></i>
                            <h6 class="mt-2 mb-0">Clientes</h6>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Activity -->
        <div class="row g-3">
            <div class="col-12 col-lg-8">
                <div class="card">
                    <div class="card-header"><h5 class="mb-0">Últimas Ventas</h5></div>
                    <div class="card-body">
                        <table class="table">
                            <thead><tr><th>ID</th><th>Fecha</th><th>Total</th><th>Estado</th></tr></thead>
                            <tbody id="ventasTable"><tr><td colspan="4" class="text-muted">Cargando...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-12 col-lg-4">
                <div class="card">
                    <div class="card-header"><h5 class="mb-0">Actividad</h5></div>
                    <div class="card-body">
                        <div class="activity-item"><div class="content"><div class="title">Venta registrada</div><div class="time">Hace 5 min</div></div></div>
                        <div class="activity-item"><div class="content"><div class="title">Inventario bajo</div><div class="time">Hace 15 min</div></div></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-footer text-center mt-4">
            <small class="text-muted">&copy; 2024 PharmaQuick</small>
        </div>
    </template>

    <!-- Template: Products Page -->
    <template id="template-productos">
        <!-- Products container -->
        <div id="productsContainer"></div>
        <div id="pricesContainer" class="d-none"></div>
    </template>

    <!-- Template: Ventas (POS) -->
    <template id="template-ventas">
        <div class="row h-100">
            <div class="col-lg-8 d-flex flex-column mb-3 mb-lg-0">
                <div class="card border-0 shadow-sm flex-grow-1">
                    <div class="card-body p-4 d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold m-0"><i class="fas fa-cash-register text-primary me-2"></i>Punto de Venta</h5>
                            <button id="btnScanBarcode" class="btn btn-outline-primary"><i class="fas fa-barcode me-2"></i>Escanear QR/Barras</button>
                        </div>
                        <div id="readerContainer" class="mb-3 d-none border rounded p-2">
                            <div id="reader" style="width: 100%;"></div>
                        </div>
                        <div class="input-group mb-4 position-relative">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-search text-muted"></i></span>
                            <input type="text" id="posSearchProduct" class="form-control border-start-0 bg-light" placeholder="Buscar por código de barras o nombre..." autocomplete="off">
                            <div id="posSearchResults" class="list-group position-absolute w-100 shadow mt-1" style="top: 100%; z-index: 1050; display: none; max-height: 300px; overflow-y: auto;"></div>
                        </div>

                        <div class="table-responsive flex-grow-1">
                            <table class="table table-hover align-middle" id="cartTable">
                                <thead class="table-light">
                                    <tr>
                                        <th>Producto</th>
                                        <th>Lote (FEFO)</th>
                                        <th style="width: 120px;">Cant.</th>
                                        <th>Precio</th>
                                        <th>Subtotal</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="cartTableBody">
                                    <tr id="emptyCartRow"><td colspan="6" class="text-center text-muted py-4"><i class="fas fa-shopping-cart fa-2x mb-2 opacity-50"></i><br>El carrito está vacío</td></tr>
